[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiktok-scraper"
version = "0.1.0"
description = "TikTok scraper in Python: profiles, posts, comments and TikTok Shop products as JSON, on the Bright Data TikTok Scraper API. No TikTok login, no browser. 5,000 free credits a month."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["brightdata-sdk>=2.5.2,<3", "rich>=13,<15"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tiktok-scraper = "tiktok_scraper.__main__:main"

[project.urls]
Homepage = "https://github.com/brightdata/tiktok-scraper"

[tool.hatch.build.targets.wheel]
packages = ["src/tiktok_scraper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
